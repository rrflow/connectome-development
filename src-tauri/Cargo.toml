[package]
name = "connectome"
version = "0.0.5"
description = "Connectome — native control surface for RRFlow runtimes"
authors = ["AngryVibes LLC"]
license = "MIT"
repository = "https://github.com/rrflow/connectome-development"
edition = "2021"
publish = false

# Connectome is a standalone repository and release boundary. Keep its Tauri
# dependency graph isolated from any engine workspace checked out beside it.
[workspace]

# objc 0.2.7 expands `cfg(feature = "cargo-clippy")` in the destination crate.
# Declare that legacy macro value as expected without weakening warning policy.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
tauri = { version = "2.4.0", features = ["devtools"] }
tauri-plugin-fs = "2.2.0"
tauri-plugin-os = "2.2.1"
tauri-plugin-log = "2.3.1"
tauri-plugin-shell = "2.2.1"
tauri-plugin-dialog = "2.2.0"
tauri-plugin-process = "2.2.0"
tauri-plugin-updater = "2.6.1"
tauri-plugin-deep-link = "2.2.0"
tauri-plugin-localhost = "2.2.0"
tauri-plugin-single-instance = "2.2.2"
portpicker = "0.1"
serde_json = "1.0"
dirs = "5.0.1"
serde = { version = "1.0", features = ["derive"] }
time = { version = "0.3", default-features = false }
log = "^0.4"
url = "2"
uuid = { version = "1", features = ["v4"] }
showfile = "0.1.1"
reqwest = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
# RRFlow's Rust SDK and contract own every authenticated RRD request and
# response type. Pinned to one rrflow-development revision so the native client
# and the engine it targets share one OpenAPI digest.
rrd-client = { git = "https://github.com/rrflow/rrflow-development", rev = "c376e27126c0fd513f8ffeb1e8e17a8befe87602" }
rrd-contract = { git = "https://github.com/rrflow/rrflow-development", rev = "c376e27126c0fd513f8ffeb1e8e17a8befe87602" }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.1"
objc = "0.2.7"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10.72", features = ["vendored"] }

[build-dependencies]
tauri-build = { version = "2.1.0" }
serde_json = "1.0"

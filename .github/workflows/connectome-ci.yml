name: Connectome CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and render smoke
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend source
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test production build
        run: pnpm test:smoke

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectome-render-smoke
          path: playwright-report
          if-no-files-found: error

  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-15
          - windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Check native formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check native crate
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Test native crate
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Lint native crate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  # The native client against a real RRD process: install a fresh estate with
  # the engine the client is pinned to, serve it on loopback, and drive every
  # lens through the session (src-tauri/src/rrd/client/process.rs).
  rrd-process:
    name: RRD process integration
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve the pinned RRFlow revision
        id: rrflow
        run: |
          rev=$(grep -m1 -oE 'rrflow-development\?rev=[0-9a-f]{40}' src-tauri/Cargo.lock | cut -d= -f2)
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cache the rrflow binary
        id: rrflow-cache
        uses: actions/cache@v4
        with:
          path: ~/.rrflow-engine
          key: rrflow-${{ steps.rrflow.outputs.rev }}-${{ runner.os }}-dev-opt1

      - name: Checkout the pinned RRFlow engine
        if: steps.rrflow-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rrflow/rrflow-development
          ref: ${{ steps.rrflow.outputs.rev }}
          path: rrflow-engine
          persist-credentials: false

      # The engine builds in its own checkout, so its own toolchain file and
      # lockfile decide how. Without debug info and at opt-level 1 the binary
      # stays small: install and serve hash the executable they pin, which takes
      # about a minute per step on the 1.2 GB unoptimised debug build and under
      # a second on this one.
      - name: Build rrflow at the pinned revision
        if: steps.rrflow-cache.outputs.cache-hit != 'true'
        working-directory: rrflow-engine
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_OPT_LEVEL: "1"
        run: |
          cargo build --locked --package rrflow-cli --bin rrflow
          mkdir -p ~/.rrflow-engine
          cp target/debug/rrflow ~/.rrflow-engine/rrflow

      - name: Run the RRD process tests
        run: |
          export RRFLOW_BIN="$HOME/.rrflow-engine/rrflow"
          "$RRFLOW_BIN" version
          cargo test --manifest-path src-tauri/Cargo.toml --locked rrd::client::process:: -- --ignored

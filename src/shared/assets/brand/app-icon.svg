<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Connectome</title>
  <!--
    The application icon is the Connectome mark drawn in the application
    (src/shared/assets/pictograms/connectome.svg): the same nodes, links,
    stroke and gradient, unchanged, placed on a dark tile. The tile follows
    the 824-unit macOS icon grid inside the 1024-unit canvas; tauri icon
    renders this file to every platform format under src-tauri/icons.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1630"/>
      <stop offset="1" stop-color="#0e0c14"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#3dd6c4"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g transform="translate(512 512) scale(3.6) translate(-120 -120)">
    <g stroke="url(#g)" stroke-width="6" stroke-linecap="round">
      <line x1="60" y1="70" x2="120" y2="120"/>
      <line x1="180" y1="70" x2="120" y2="120"/>
      <line x1="60" y1="170" x2="120" y2="120"/>
      <line x1="180" y1="170" x2="120" y2="120"/>
    </g>
    <g fill="url(#g)">
      <circle cx="120" cy="120" r="22"/>
      <circle cx="60" cy="70" r="14"/>
      <circle cx="180" cy="70" r="14"/>
      <circle cx="60" cy="170" r="14"/>
      <circle cx="180" cy="170" r="14"/>
    </g>
    <circle cx="120" cy="120" r="9" fill="#ffffff" fill-opacity="0.9"/>
  </g>
</svg>
